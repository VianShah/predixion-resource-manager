# Render blueprint for the Resource Manager dashboard.
# Secrets are NOT stored here: every `sync: false` value is typed into the Render dashboard (Environment tab).
services:
  - type: web
    name: predixion-resource-manager
    runtime: python
    region: singapore            # closest Render region to Mumbai (VERIFY availability)
    plan: starter                # FOR FOUNDER REVIEW: plan and monthly cost. A disk needs a paid plan (VERIFY).
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    disk:                        # FOR FOUNDER REVIEW: without a disk, SQLite history resets on every deploy/restart
      name: rm-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9            # the version the test suite was run on
      - key: RM_HOST
        value: 0.0.0.0
      - key: RM_DB_PATH
        value: /var/data/rm.sqlite
      - key: RM_COLLECT_INTERVAL_MIN
        value: "15"
      - key: RM_DASHBOARD_USER
        value: admin
      - key: RM_DASHBOARD_PASSWORD
        sync: false
      - key: RM_INGEST_TOKEN
        sync: false
      - key: AWS_ACCOUNT_ID
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_MONTHLY_BUDGET_USD
        sync: false
      - key: VOBIZ_AUTH_ID
        sync: false
      - key: VOBIZ_AUTH_TOKEN
        sync: false
      - key: INTERAKT_WEBHOOK_SECRET
        sync: false
      - key: SARVAM_PLAN
        value: payg
